[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-self-evolution"
version = "0.1.0"
description = "Evolutionary self-improvement for agent skills — optimize skills, prompts, tool descriptions, and code using DSPy + GEPA"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.15"
authors = [
    {name = "azalith-9"},
    {name = "jramos"},
    {name = "Nous Research"},
]
keywords = ["llm", "optimization", "evolution", "dspy", "gepa", "agent", "skill"]

dependencies = [
    "dspy[litellm]>=3.4.1,<3.5",
    "gepa==0.1.4",
    # Cost/failure observability uses LiteLLM's module-level callback lists.
    "litellm>=1.82.0,<2.0",
    "openai>=1.0.0",
    "click>=8.0",
    "rich>=13.0",
    "reportlab>=4.0",
    # Used by stats.paired_bootstrap. Floor predates the 2.0 ABI break;
    # no upper bound — only stable np.array/np.percentile/np.random APIs.
    "numpy>=1.24",
    # Used by generate_report.py to load reports/<phase>_prose.yaml.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
miprov2 = [
    "dspy[optuna]>=3.4.1,<3.5",
]
swebench = [
    "datasets>=2.0",
    "docker>=7.0",
    "swebench==4.1.0",
]

[dependency-groups]
dev = [
    "setuptools>=68.0",
    "wheel",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pre-commit>=3.5",
    "ruff>=0.15,<0.16",
]

[project.urls]
Homepage = "https://github.com/azalith-9/agent-self-evolution"
Repository = "https://github.com/azalith-9/agent-self-evolution"

[tool.setuptools.packages.find]
include = ["evolution*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: requires local integration resources (e.g. a source-repo clone); deselect with -m 'not slow'",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Linter-only adoption: ruff's default rule set (pyflakes + a curated pycodestyle
# subset). The formatter and line-length (E501) are deliberately deferred — the
# tree is written to a ~100-char style, so a one-shot reformat (line-length 100,
# recorded in .git-blame-ignore-revs) is tracked separately, not gated here.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests favor compact fixtures: allow mid-file imports (E402), one-line compound
# statements (E702), and ambiguous local names (E741). Every pyflakes (F) rule —
# the real-bug class (unused imports/vars, undefined names) — stays enforced here.
"tests/**" = ["E402", "E702", "E741"]
